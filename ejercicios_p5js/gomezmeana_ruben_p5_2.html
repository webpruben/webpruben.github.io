<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 2 - Colores aleatorios</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <script>
    function setup() {
      createCanvas(800, 800);
      background(170, 240, 170); // verde claro
      strokeWeight(4);

      // Letra R (color aleatorio propio)
      stroke(random(255), random(255), random(255));
      line(100, 250, 100, 550);  // palo vertical
      line(100, 250, 200, 250);  // arriba
      line(200, 250, 250, 300);  // esquina superior
      line(250, 300, 250, 350);  // lado derecho
      line(250, 350, 200, 400);  // esquina inferior
      line(200, 400, 100, 400);  // cierre del bucle
      line(170, 400, 260, 550);  // pierna

      // Letra G (color aleatorio propio)
      stroke(random(255), random(255), random(255));
      line(420, 250, 330, 250);  // arriba
      line(330, 250, 300, 280);  // esquina superior izquierda
      line(300, 280, 300, 520);  // lado izquierdo
      line(300, 520, 330, 550);  // esquina inferior izquierda
      line(330, 550, 420, 550);  // abajo
      line(420, 550, 450, 520);  // esquina inferior derecha
      line(450, 520, 450, 420);  // lado derecho
      line(450, 420, 380, 420);  // barra interior

      // Letra M (color aleatorio propio)
      stroke(random(255), random(255), random(255));
      line(520, 550, 520, 250);  // palo izquierdo
      line(520, 250, 620, 420);  // diagonal hacia abajo
      line(620, 420, 720, 250);  // diagonal hacia arriba
      line(720, 250, 720, 550);  // palo derecho
    }
  </script>
</body>
</html>

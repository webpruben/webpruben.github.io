   <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 4 Operadores lógicos</title>
    </head>
    <body>

 
        <h1>Ejercicio 4 Operadores lógicos</h1>

 
        <script>

    var A = 10;
    var B = 20;
       document.write("<h2>Resultados de operadores lógicos</h2>");
            document.write("<p>(A < B && B < A): " + (A < B && B < A) + "</p>");
            document.write("<p>(A < B || B < A): " + (A < B || B < A) + "</p>");
            document.write("<p>!(A < B): " + (!(A < B)) + "</p>");
            document.write("<p>(A < 200 && B > 0): " + (A > 2 && B < 90) + "</p>");
            document.write("<p>(A > 1 || B > 40): " + (A < 5 || B >10 ) + "</p>");
 
        </script>

 
    </body>
    </html>
